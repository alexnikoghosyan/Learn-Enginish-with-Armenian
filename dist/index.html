<!doctype html>
<html lang="hy"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#204d3d"><meta name="description" content="Սովորիր անգլերեն՝ հայերեն դասերով, բառաքարտերով և վարժություններով։"><link rel="manifest" href="/manifest.webmanifest"><title>English Garden — Անգլերեն քայլ առ քայլ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&family=Nunito:wght@800&display=swap');

margin-top:25px}.hero-content{position:relative;z-index:1;max-width:70%}.hero h2{font-size:29px;line-height:1.6;margin:0}.hero p{color:#ccdacb;font-size:13px;max-width:450px}.hero .eyebrow{color:#cadd99}.plant{position:absolute;right:40px;bottom:0;width:190px;height:240px}.stem{position:absolute;background:#b6d17d;width:4px;height:170px;bottom:0;left:92px;transform:rotate(9deg)}.leaf{position:absolute;width:80px;height:39px;background:#abc777;border-radius:0 90px 0 90px;transform:rotate(-20deg)}.leaf:nth-child(2){left:21px;top:80px;transform:rotate(20deg);background:#d5e5a1}.leaf:nth-child(3){left:95px;top:49px;transform:rotate(-50deg)}.leaf:nth-child(4){left:94px;top:118px;transform:rotate(-55deg);background:#d5e5a1}.leaf:nth-child(5){left:13px;top:146px;transform:rotate(25deg)}.primary,.secondary{border:0;border-radius:8px;padding:12px 20px;font-weight:600}.primary{background:var(--green);color:#fff}.hero .primary{background:var(--lime);color:var(--green)}.secondary{background:#edf1e6;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:23px 0 33px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.stat{display:flex;gap:14px;align-items:center}.stat-icon{background:#f1f4e9;padding:12px;border-radius:10px;font-size:20px}.stat strong{font:700 26px Georgia,serif;display:block}.stat small{font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 17px}.section-head h2{margin:0}.text-button{background:none;border:0;color:var(--green);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.lesson-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:23px;text-align:left;color:var(--ink);transition:transform .2s}.lesson-card:hover{transform:translateY(-3px);border-color:#8fA57b}.number{width:37px;height:37px;display:grid;place-items:center;border-radius:10px;background:#edf2e3;color:var(--green);margin-bottom:23px}.lesson-card h3{margin:0 0 6px}.lesson-card p{font-size:12px;color:var(--muted);margin:0 0 20px}.tag{font-size:10px;padding:4px 8px;border-radius:5px;background:#f2f4eb;color:#758165}.card-foot{display:flex;justify-content:space-between;align-items:center}.bottom-note{margin-top:28px;background:#ecefdf;padding:20px 25px;border-radius:12px;display:flex;gap:18px;align-items:center;font-size:12px}.bottom-note strong{display:block;margin-bottom:5px}.tools{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}input,select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;color:var(--ink)}input[type=search]{flex:1;min-width:180px}.word-row{display:flex;gap:15px;align-items:center;padding:15px 6px;border-bottom:1px solid var(--line)}.word-en{font:600 19px Georgia,serif;width:190px;overflow-wrap:anywhere}.word-hy{flex:1;font-size:13px}.icon-btn{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 11px;color:var(--green)}.pager{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:22px}.flash-wrap{max-width:680px;margin:30px auto;text-align:center}.flash{width:100%;min-height:290px;background:white;border:1px solid var(--line);border-radius:20px;padding:35px;color:var(--ink);box-shadow:0 12px 35px #204d3d08}.flash .big{font:48px Georgia,serif;margin:35px 0}.flash .translation{font-size:24px;margin:35px 0}.flash-actions{display:flex;justify-content:center;gap:10px;margin:20px 0}.progress{height:7px;background:#e7ecdf;border-radius:10px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:#90ab67}.lesson-body{max-width:850px;margin:auto}.rule{padding:20px 25px;background:#edf2e3;border-left:4px solid #87a265;border-radius:8px;line-height:2}.example{padding:17px 0;border-bottom:1px solid var(--line)}.example b{display:block;font:22px Georgia,serif;margin-bottom:7px}.quiz{margin-top:28px;padding:24px;background:white;border:1px solid var(--line);border-radius:13px}.option .picture-tabs,.picture-topics{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.picture-tabs button[aria-pressed=true],.picture-topics button[aria-pressed=true]{background:#d8eeff;color:#08639a}
.picture-grid{display:grid;grid-template-columns:repeat(4,minmax(0,145px));gap:12px;margin:20px 0}
.picture-tile{display:grid;justify-items:center;align-content:center;gap:7px;min-height:145px;border:2px solid #e2e7ea;border-bottom-width:4px;border-radius:14px;background:#fff;color:#344752;padding:10px 5px;font-size:16px}
.picture-tile:hover{background:#f1faff;border-color:#a6d9f5}
.picture-tile[aria-pressed=true]{background:#dcf3ff;border-color:#78cbf6;color:#087cb7}
.picture-tile small{font-size:11px;color:inherit}
.picture-emoji{font-size:52px;line-height:70px}img.picture-img{display:inline-block;width:1.35em;height:1.35em;object-fit:contain;vertical-align:middle}
.picture-feedback{min-height:20px;font-weight:700}
button:disabled{cursor:default;opacity:.65}
.drink-art{display:block;position:relative;width:72px;height:70px}
.drink-art i,.drink-art b,.drink-art::before,.drink-art::after{display:block;position:absolute;content:""}
.coffee i{background:#82480e;border:5px solid #b4e8f3;width:49px;height:34px;left:10px;bottom:9px;border-radius:9px 9px 19px 19px}
.coffee b{background:#3d4443;width:48px;height:9px;left:11px;top:23px;border-radius:5px;transform:rotate(-7deg)}
.coffee::before{background:#3d4443;width:12px;height:12px;left:25px;top:16px;border-radius:2px;transform:rotate(12deg)}
.coffee::after{background:#3d4443;width:15px;height:8px;right:3px;top:22px;border-radius:4px}
.milk i{width:33px;height:44px;left:10px;bottom:8px;background:linear-gradient(#44c6ed 35%,#ebfaff 35% 66%,#269dce 66%);border-radius:3px;transform:rotate(-3deg)}
.milk::before{width:32px;height:9px;left:9px;top:12px;background:#1588bd;border-radius:3px;transform:rotate(-3deg)}
.milk b{width:22px;height:34px;right:9px;bottom:8px;background:linear-gradient(#c9f5ff 32%,#fff 32%);border:3px solid #64d2f2;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)}
.water i{width:28px;height:43px;left:22px;bottom:7px;background:linear-gradient(#c9f9ff 22%,#36c6f2 23%);border:4px solid #8ee9fb;border-radius:13px 13px 6px 6px}
.water b{width:14px;height:8px;left:29px;top:13px;background:#2399c1;border-radius:3px}
.tea i{width:40px;height:32px;left:12px;bottom:14px;background:#e8f1e8;border:4px solid #e9ae28;border-radius:2px 2px 15px 15px}
.tea b{width:16px;height:18px;right:9px;bottom:23px;border:4px solid #e9ae28;border-radius:7px}
.tea::after{width:57px;height:5px;left:6px;bottom:10px;background:#e9ae28;border-radius:6px}
@media(max-width:650px){.picture-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:440px}.picture-tile{min-height:130px}}

.word-lesson-meta{display:flex;align-items:center;justify-content:space-between;max-width:790px}
.lesson-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;padding:0;max-width:790px;margin:18px 0;color:var(--muted)}
.lesson-steps li{border-top:4px solid var(--line);padding-top:8px;text-align:center;font-size:12px}
.lesson-steps li[aria-current=step]{border-color:#359fc9;color:#12678a;font-weight:800}
.word-lesson-panel{max-width:790px;padding:clamp(18px,4vw,36px)}
.word-artwork{margin:0 0 24px;display:grid;place-items:center;align-content:center;gap:11px;min-height:190px;text-align:center;border-radius:16px;border:2px solid hsl(var(--word-hue) 40% 86%);background:hsl(var(--word-hue) 55% 96%);padding:20px;overflow-wrap:anywhere}
.word-artwork strong{font-size:clamp(27px,5vw,43px);line-height:1.12}
.word-artwork figcaption{font-size:12px;color:#4c5e57}
.word-artwork .drink-art{scale:1.2;margin:7px}
.word-monogram{font-size:33px;font-weight:800;display:grid;place-items:center;width:72px;height:72px;background:hsl(var(--word-hue) 55% 85%);border-radius:19px;transform:rotate(-5deg)}
.word-content h2{margin-top:18px}.word-content a{color:#186c87}
.word-lesson-panel label{display:block;font-weight:700;margin:18px 0 8px}
.word-lesson-panel textarea{width:100%;min-height:108px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit;color:var(--ink);background:#fcfdfb}
.word-lesson-panel textarea:focus-visible{outline:2px solid #359fc9}
.word-lesson-panel blockquote,.written-answer{margin:12px 0;padding:14px 17px;border-radius:9px;background:#edf5ef;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.word-lesson-panel blockquote small{display:block}
.word-lesson-error{color:#a3392c;font-weight:700;margin:0}.word-actions{margin-bottom:0}.word-link{text-align:left;padding:0;font:inherit}
@media(max-width:500px){.lesson-steps li{font-size:10px}.word-lesson-panel textarea{min-height:95px}}

.learning-path{max-width:660px}
.path-intro,.path-page-controls,.path-unit-heading{display:flex;align-items:center;justify-content:space-between;gap:14px}
.path-intro h2,.path-intro p{margin:0}.path-intro p{color:var(--muted);margin-top:5px}
.path-page-controls{margin:18px 0}.path-return{padding:0 0 14px}
.path-unit{margin:0 0 22px;background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.path-unit-heading{padding:17px 22px;background:#e4efd6;color:var(--green)}
.path-unit-heading small{color:inherit}.path-unit-heading h3{margin:4px 0 0}.path-unit-heading>span{white-space:nowrap;font-weight:700}
.path-unit ol{margin:0;padding:20px;list-style:none;display:grid;gap:14px}
.path-stop{position:relative;display:flex;gap:15px;align-items:center;margin-inline-start:calc(var(--bend)*clamp(13px,6vw,42px))}
.path-stop small{display:block;margin-top:3px}.path-stop strong{font-size:15px;overflow-wrap:anywhere}
.path-node{flex:none;width:54px;height:52px;border:0;border-radius:50%;font-size:22px;font-weight:800;background:#dce3db;color:#546453;box-shadow:0 4px #bdc7bb}
.path-node.path-done{background:#d3e8bd;color:#22573b;box-shadow:0 4px #abc997}
.path-node.path-current{background:#377a4d;color:white;box-shadow:0 4px #245533,0 0 0 5px #def0d8}
.path-node.path-locked{opacity:1}

.study-home{max-width:960px;margin-inline:auto}
.study-welcome{background:#204d3d;color:white;border-radius:20px;padding:clamp(24px,5vw,46px);margin-bottom:22px}
.study-welcome h1{font-size:clamp(26px,4vw,42px);margin-bottom:7px}
.study-welcome p{margin:0;color:#e0ebdc}
.study-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.study-card h2,.study-card p,.journal-shortcut h2,.journal-shortcut p{margin:0}
.study-card p,.journal-shortcut p{color:#52665a}
.study-card progress{width:100%;height:10px;accent-color:#377a4d;margin:14px 0 8px}
.study-card .study-next{font-weight:700;color:var(--ink);margin:7px 0 16px;overflow-wrap:anywhere}
.journal-shortcut{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}
.journal-label{display:block;font-weight:700;margin:22px 0 7px}
#journal-search{width:100%}
.journal-entry{margin-top:14px;overflow-wrap:anywhere}
.journal-entry header{display:flex;justify-content:space-between;gap:12px}
.journal-entry h2{margin:0}
.journal-entry p,.journal-entry blockquote{white-space:pre-wrap}
.journal-entry blockquote{margin:10px 0;padding:10px 14px;background:#edf2e3;border-radius:8px}
.journal-entry button{margin-top:8px}
@media(max-width:560px){.study-cards{grid-template-columns:1fr}.journal-shortcut{align-items:flex-start;flex-direction:column}}
